<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161a22;
    --ink-soft:#3a3f4d;
    --paper:#efe8d8;
    --paper-line:#c9bfa4;
    --paper-shadow: rgba(0,0,0,0.35);
    --gold:#b8873b;
    --gold-soft:#e4c98a;
    --green:#2f6f4e;
    --green-soft:#dcebe1;
    --red:#a5352a;
    --red-soft:#f3ddd8;
    --navy-bg:#12141b;
    --navy-bg2:#1c2130;
    --muted:#8a8d99;
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #232a3e 0%, transparent 60%),
      linear-gradient(180deg, var(--navy-bg) 0%, var(--navy-bg2) 100%);
    min-height:100vh;
    font-family:'Inter', system-ui, sans-serif;
    color: var(--ink);
    padding: 36px 16px 80px;
  }

  .wrap{ max-width: 640px; margin: 0 auto; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.22em;
    color: var(--gold-soft);
    text-align:center; margin-bottom: 10px;
    text-transform:uppercase;
  }
  h1{
    font-family:'Newsreader', serif;
    font-style: italic; font-weight: 500;
    font-size: 44px; color: #f4efe2;
    text-align:center; margin: 0 0 26px;
    letter-spacing: -0.01em;
  }

  /* ---------- Folder tabs ---------- */
  .tabs{
    display:flex;
    gap: 4px;
    padding-left: 18px;
    margin-bottom: -2px;
    position: relative;
    z-index: 2;
  }
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    background: #262c3d;
    border: none;
    padding: 11px 20px 13px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    transition: background .15s, color .15s, transform .1s;
    transform: translateY(4px);
  }
  .tab .n{ color: var(--gold-soft); margin-right: 6px; }
  .tab.active{
    background: var(--paper);
    color: var(--ink);
    transform: translateY(0);
  }
  .tab.active .n{ color: var(--gold); }
  .tab:not(.active):hover{ background: #2e3548; color:#cfd2dc; }

  /* ---------- Ledger sheet ---------- */
  .page{ display:none; }
  .page.active{ display:block; }

  .ledger{
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 34px, rgba(150,130,90,0.13) 35px);
    border-radius: 0 var(--radius) var(--radius) var(--radius);
    box-shadow: 0 30px 60px -20px var(--paper-shadow), 0 2px 0 rgba(255,255,255,0.04) inset;
    padding: 56px 30px 26px;
    position: relative;
    overflow: hidden;
  }
  .ledger::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:56px;
    background: linear-gradient(90deg, rgba(184,135,59,0.14), transparent);
    border-right: 1px dashed var(--paper-line);
  }
  .ledger-inner{ position:relative; padding-left: 56px; }

  .field-row{ display:flex; align-items:flex-end; gap:12px; margin-bottom: 14px; }
  .field{ flex:1; min-width:0; }
  .field label{
    display:block; font-family:'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 5px;
  }
  .field input, .field select{
    width:100%; background: transparent; border:none;
    border-bottom: 1.5px solid var(--paper-line);
    font-family:'JetBrains Mono', monospace; font-size: 16px;
    color: var(--ink); padding: 3px 2px 6px; outline:none;
    transition: border-color .15s;
  }
  .field input::placeholder{ color: #a79a7a; font-weight:400; }
  .field input:focus, .field select:focus{ border-bottom-color: var(--gold); }
  .field.small{ flex: 0 0 62px; }
  .field.tiny{ flex: 0 0 44px; }
  .mult-sign{ padding-bottom: 9px; color:var(--paper-line); font-family:'JetBrains Mono',monospace; font-size:15px;}
  .line-total{
    flex: 0 0 92px; text-align:right;
    font-family:'JetBrains Mono', monospace; font-size:15px;
    padding-bottom: 8px; color: var(--ink-soft);
  }
  .remove-line{
    flex: 0 0 20px; background:none; border:none; cursor:pointer;
    color: var(--muted); font-size: 16px; padding-bottom: 6px;
    transition: color .15s;
  }
  .remove-line:hover{ color: var(--red); }

  .add-line{
    background:none; border:none;
    font-family:'JetBrains Mono', monospace; font-size: 11.5px;
    letter-spacing:.05em; color: var(--gold); cursor:pointer;
    padding: 2px 0 16px; display:inline-flex; align-items:center; gap:5px;
  }
  .add-line:hover{ color:#946c2c; }

  .hint{ font-family:'Inter'; font-size: 11px; color: var(--muted); margin: -6px 0 16px; }

  .divider{ border:none; border-top: 1px solid var(--paper-line); margin: 20px 0; }
  .divider.double{ border-top: 3px double var(--ink); margin: 10px 0 18px; }

  /* ---------- Tax block ---------- */
  .tax-block{
    display:flex; align-items:center; gap:12px; margin-bottom: 14px;
    padding: 10px 12px; background: rgba(255,255,255,0.28);
    border: 1px solid var(--paper-line); border-radius: var(--radius);
  }
  .tax-name{
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
    letter-spacing:.04em; color: var(--ink-soft); width: 54px; flex-shrink:0;
  }
  .toggle{ position:relative; width: 38px; height: 20px; flex-shrink:0; cursor:pointer; }
  .toggle input{ display:none; }
  .toggle .track{ position:absolute; inset:0; background: #cbbf9d; border-radius: 20px; transition: background .15s; }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; background: #fffdf7; border-radius:50%; box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: transform .15s; }
  .toggle input:checked + .track{ background: var(--green); }
  .toggle input:checked + .track .knob{ transform: translateX(18px); }

  .sign-toggle{
    flex-shrink:0; background: transparent; border:none;
    border-bottom: 1.5px solid var(--paper-line);
    font-family:'JetBrains Mono', monospace; font-weight:600; font-size: 15px;
    color: var(--ink-soft); padding: 2px 7px 4px; cursor:pointer; transition: color .15s, border-color .15s;
  }
  .sign-toggle.neg{ color: var(--red); border-color: var(--red); }

  .tax-rate select{
    width: 78px; background: transparent; border:none;
    border-bottom: 1.5px solid var(--paper-line);
    font-family:'JetBrains Mono', monospace; font-size: 14px; color: var(--ink);
    padding: 2px; outline:none;
  }
  .add-rate{ background:none; border:none; font-family:'JetBrains Mono', monospace; font-size: 15px; color: var(--gold); cursor:pointer; width: 20px; }
  .tax-amount{ margin-left:auto; font-family:'JetBrains Mono', monospace; font-size: 15px; color: var(--ink); min-width: 90px; text-align:right; }

  /* ---------- Totals ---------- */
  .total-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 6px; font-family:'JetBrains Mono', monospace; font-size: 13.5px; color: var(--ink-soft); }
  .total-row.final{ font-size: 21px; color: var(--ink); font-weight:700; margin-top: 4px; }
  .total-row.credit .amt{ color: var(--red); }
  .total-row.debit .amt{ color: var(--green); }

  /* ---------- Verdict stamp ---------- */
  .verdict-area{ margin-top: 24px; min-height: 108px; position: relative; display:flex; align-items:center; justify-content: space-between; gap: 16px; }
  .diff-readout{ font-family:'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-soft); line-height:1.6; }
  .diff-readout .num{ font-size:16px; color: var(--ink); font-weight:600;}
  .stamp{
    width: 118px; height: 118px; border-radius: 50%; border: 3px solid var(--red); color: var(--red);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 15px; letter-spacing:.08em;
    transform: rotate(-9deg); opacity: 0; transition: opacity .25s ease, transform .25s ease;
    position:relative; flex-shrink:0; mix-blend-mode: multiply;
  }
  .stamp::before{ content:""; position:absolute; inset:6px; border: 1px solid currentColor; border-radius:50%; opacity:.55; }
  .stamp.show{ opacity:.92; transform: rotate(-9deg) scale(1); }
  .stamp.match{ border-color: var(--green); color: var(--green); }

  .save-btn{
    display:block; margin: 26px auto 4px; background: var(--ink); color: #f0ead9; border:none;
    font-family:'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing:.1em; text-transform:uppercase;
    padding: 12px 26px; border-radius: 20px; cursor:pointer; transition: transform .12s, background .15s;
  }
  .save-btn:hover{ background:#2a3040; transform: translateY(-1px); }
  .save-btn:active{ transform: translateY(0); }

  /* ---------- History ---------- */
  .history-title{
    font-family:'JetBrains Mono', monospace; font-size: 11px; letter-spacing:.18em; text-transform:uppercase;
    color: var(--muted); margin: 40px 0 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .history-title button{ background:none; border:none; color: var(--muted); font-family:'JetBrains Mono', monospace; font-size: 10.5px; text-decoration: underline; cursor:pointer; letter-spacing:.05em; }
  .stub{ display:flex; align-items:center; gap: 12px; padding: 11px 4px; border-bottom: 1px dashed rgba(255,255,255,0.12); font-family:'JetBrains Mono', monospace; font-size: 12.5px; color: #cfd2dc; }
  .stub .dot{ width:8px; height:8px; border-radius:50%; background: var(--muted); flex-shrink:0; }
  .stub .dot.match{ background: var(--green); }
  .stub .dot.check{ background: var(--red); }
  .stub .time{ color: var(--muted); width: 108px; flex-shrink:0; font-size:11px;}
  .stub .amt{ margin-left:auto; color:#f0ead9; }
  .empty-note{ color: var(--muted); font-size: 12.5px; font-family:'JetBrains Mono', monospace; padding: 10px 4px; }

  /* ---------- Debit/Credit columns ---------- */
  .dc-cols{ display:flex; gap: 20px; }
  .dc-col{ flex:1; min-width:0; }
  .dc-col-head{
    font-family:'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing:.12em; text-transform:uppercase;
    padding-bottom: 6px; margin-bottom: 10px; border-bottom: 2px solid var(--ink);
  }
  .dc-col-head.debit{ color: var(--green); }
  .dc-col-head.credit{ color: var(--red); }
  .dc-row{ display:flex; align-items:center; gap:8px; margin-bottom: 10px; }
  .dc-row input[type=text]{
    flex: 1; min-width:0; background: transparent; border:none; border-bottom: 1px solid var(--paper-line);
    font-family:'Inter'; font-size: 12.5px; color: var(--ink-soft); padding: 3px 2px; outline:none;
  }
  .dc-row input[type=number]{
    flex: 0 0 84px; background: transparent; border:none; border-bottom: 1.5px solid var(--paper-line);
    font-family:'JetBrains Mono', monospace; font-size: 14.5px; color: var(--ink); padding: 3px 2px; outline:none; text-align:right;
  }
  .dc-row input:focus{ border-bottom-color: var(--gold); }
  @media (max-width: 480px){
    .dc-cols{ flex-direction:column; gap: 26px; }
  }

  @media (max-width: 480px){
    h1{ font-size: 34px; }
    .ledger{ padding: 50px 16px 20px; }
    .ledger-inner{ padding-left: 30px; }
    .ledger::before{ width: 26px; }
    .field-row{ flex-wrap:wrap; }
    .tab{ padding: 10px 14px 12px; font-size: 10.5px; }
  }

  /* ---------- Corner actions: Print + Reset ---------- */
  .corner-actions{ position:absolute; top:14px; right:16px; z-index:3; display:flex; gap:6px; }
  .corner-btn{
    background: transparent; color: var(--gold); border: 1px solid rgba(184,135,59,0.45);
    font-family:'JetBrains Mono', monospace; font-size: 10px; letter-spacing:.08em; text-transform:uppercase;
    padding: 6px 12px; border-radius: 14px; cursor:pointer; transition: background .15s, color .15s;
  }
  .corner-btn:hover{ background: rgba(184,135,59,0.12); }
  .corner-btn.reset{ border-color: rgba(165,53,42,0.45); color: var(--red); }
  .corner-btn.reset:hover{ background: rgba(165,53,42,0.12); }

  /* ---------- Handwritten note area ---------- */
  .note-area{
    margin-top: 28px; padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
  }
  .note-label{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing:.09em; text-transform:uppercase;
    color: var(--ink-soft); margin-bottom: 8px;
  }
  .note-icon{ color: var(--gold); font-size: 14px; }
  .handNote{
    display:block; width:100%; min-height: 66px; resize: vertical; box-sizing:border-box;
    background: rgba(255,255,255,0.28);
    border: 1px dashed var(--paper-line); border-radius: var(--radius);
    font-family:'Tajawal', 'Inter', sans-serif; font-size: 14px; line-height: 1.7; color: var(--ink);
    padding: 9px 11px; outline:none; transition: border-color .15s, background .15s;
  }
  .handNote::placeholder{ color:#a79a7a; font-family:'Inter', sans-serif; }
  .handNote:focus{ border-color: var(--gold); background: rgba(255,255,255,0.42); }

  @page{ margin: 14mm 12mm; }

  /* ---------- Print stylesheet ---------- */
  @media print{
    body{ background:#fff !important; padding:0; }
    .eyebrow{ display:none; }
    h1{ color:#161a22; font-size:28px; margin-bottom:14px; }
    .tabs, .add-line, .add-rate, .remove-line, .save-btn,
    .history-title, #historyList, .hint, .toggle, .corner-actions{ display:none !important; }
    .page{ display:block !important; }
    .page:not(.active){ display:none !important; }
    .ledger{ box-shadow:none; border:1px solid #b9ae8e; background-image:none; }
    .ledger::before{ display:none; }
    .ledger-inner{ padding-left:0; }
    .stamp{ opacity:.92 !important; transform: rotate(-9deg) scale(1) !important; }
    .history-title{ margin-top:26px; color:#161a22; }
    .stub{ color:#161a22; border-bottom:1px dashed #c9bfa4; }
    .stub .time{ color:#6b6f7a; }
    .stub .amt{ color:#161a22; }
    .tax-block{ background:none; }
    .wrap{ max-width:100%; }
    ::placeholder{ color: transparent !important; }
    .note-area.note-empty{ display:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Reconciliation · Any Invoice, Any Total</div>
  <h1>Ledger</h1>

  <div class="tabs">
    <button class="tab active" data-page="1"><span class="n">01</span>Debit / Credit</button>
    <button class="tab" data-page="2"><span class="n">02</span>Invoice Check</button>
  </div>

  <!-- ================= PAGE 1: DEBIT / CREDIT ================= -->
  <div class="page active" id="page1">
    <div class="ledger">
      <div class="corner-actions">
        <button class="corner-btn" data-print="1">Print</button>
        <button class="corner-btn reset" data-reset="1">Reset</button>
      </div>
      <div class="ledger-inner">

        <div class="field-row" style="margin-bottom:20px;">
          <div class="field"><label>Ref / Note</label><input type="text" class="reportRef" placeholder="optional"></div>
          <div class="field small" style="flex:0 0 120px;"><label>Date</label><input type="text" class="reportDate"></div>
        </div>

        <div class="dc-cols">
          <div class="dc-col">
            <div class="dc-col-head debit">Debit (+)</div>
            <div id="debitRows"></div>
            <button class="add-line" data-dc="debit">+ add line</button>
          </div>
          <div class="dc-col">
            <div class="dc-col-head credit">Credit (−)</div>
            <div id="creditRows"></div>
            <button class="add-line" data-dc="credit">+ add line</button>
          </div>
        </div>

        <hr class="divider double">

        <div class="total-row debit"><span>Total debit</span><span class="amt" id="dcDebitTotal">0.00</span></div>
        <div class="total-row credit"><span>Total credit</span><span class="amt" id="dcCreditTotal">0.00</span></div>
        <div class="total-row final"><span>Net</span><span class="amt" id="dcNet">0.00</span></div>

        <div class="note-area">
          <div class="note-label"><span class="note-icon">✎</span>note</div>
          <textarea class="handNote" dir="auto" rows="3" placeholder="write anything here..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 2: INVOICE CHECK ================= -->
  <div class="page" id="page2">
    <div class="ledger">
      <div class="corner-actions">
        <button class="corner-btn" data-print="2">Print</button>
        <button class="corner-btn reset" data-reset="2">Reset</button>
      </div>
      <div class="ledger-inner">

        <div class="field-row" style="margin-bottom:20px;">
          <div class="field"><label>Ref / Note</label><input type="text" class="reportRef" placeholder="optional"></div>
          <div class="field small" style="flex:0 0 120px;"><label>Date</label><input type="text" class="reportDate"></div>
        </div>

        <div id="itemRows"></div>
        <button class="add-line" id="addItem">+ add item</button>
        <p class="hint" style="margin-top:2px;">Qty × Price per item sums into Total sales below — or edit Total sales directly.</p>

        <div class="field-row">
          <div class="field">
            <label>Total sales</label>
            <input type="number" id="totalSales" placeholder="0.00">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Discount</label>
            <input type="number" id="discount" placeholder="0.00" value="0">
          </div>
        </div>

        <hr class="divider">

        <div class="tax-block">
          <span class="tax-name">Tax A</span>
          <label class="toggle"><input type="checkbox" id="taxAOn" checked><span class="track"><span class="knob"></span></span></label>
          <div class="tax-rate"><select id="taxARate"></select></div>
          <button class="add-rate" id="addRateA" title="Add a new rate">+</button>
          <button class="sign-toggle" id="taxASign" data-sign="1" title="Add or subtract this tax">+</button>
          <span class="tax-amount" id="taxAAmt">0.00</span>
        </div>

        <div class="tax-block">
          <span class="tax-name">Tax B</span>
          <label class="toggle"><input type="checkbox" id="taxBOn" checked><span class="track"><span class="knob"></span></span></label>
          <div class="tax-rate"><select id="taxBRate"></select></div>
          <button class="add-rate" id="addRateB" title="Add a new rate">+</button>
          <button class="sign-toggle" id="taxBSign" data-sign="1" title="Add or subtract this tax">+</button>
          <span class="tax-amount" id="taxBAmt">0.00</span>
        </div>

        <hr class="divider double">

        <div class="total-row"><span>Net</span><span class="amt" id="netOut">0.00</span></div>
        <div class="total-row"><span>Total tax</span><span class="amt" id="taxOut">0.00</span></div>
        <div class="total-row final"><span>Computed total</span><span class="amt" id="computedOut">0.00</span></div>

        <hr class="divider">

        <div class="field-row" style="margin-bottom:0;">
          <div class="field">
            <label>Actual amount (from invoice)</label>
            <input type="number" id="actual" placeholder="0.00">
          </div>
        </div>

        <div class="verdict-area">
          <div class="diff-readout" id="diffReadout"></div>
          <div class="stamp" id="stamp">CHECK</div>
        </div>

        <button class="save-btn" id="saveBtn">Save to history</button>

        <div class="note-area">
          <div class="note-label"><span class="note-icon">✎</span>note</div>
          <textarea class="handNote" dir="auto" rows="3" placeholder="write anything here..."></textarea>
        </div>
      </div>
    </div>

    <div class="history-title">
      <span>History</span>
      <button id="clearHistory">clear</button>
    </div>
    <div id="historyList"></div>
  </div>

</div>

<script>
const el = id => document.getElementById(id);
const fmt = n => (isNaN(n) ? '0.00' : n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}));

function limitDecimals(e, n){
  const v = e.target.value;
  const parts = v.split('.');
  if (parts[1] && parts[1].length > n){
    e.target.value = parts[0] + '.' + parts[1].slice(0, n);
  }
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    el('page' + btn.dataset.page).classList.add('active');
  });
});

/* ==================================================
   PAGE 1 — DEBIT / CREDIT
================================================== */
let debitLines = [{amt:null,note:''}];
let creditLines = [{amt:null,note:''}];

function renderDC(){
  const debitContainer = el('debitRows');
  const creditContainer = el('creditRows');
  debitContainer.innerHTML = '';
  creditContainer.innerHTML = '';

  debitLines.forEach((line, i) => {
    debitContainer.appendChild(makeDCRow(line, i, 'debit'));
  });
  creditLines.forEach((line, i) => {
    creditContainer.appendChild(makeDCRow(line, i, 'credit'));
  });
  computeDC();
}

function makeDCRow(line, index, type){
  const row = document.createElement('div');
  row.className = 'dc-row';

  const note = document.createElement('input');
  note.type = 'text';
  note.placeholder = 'note';
  note.value = line.note || '';
  note.addEventListener('input', e => { line.note = e.target.value; });

  const amt = document.createElement('input');
  amt.type = 'number';
  amt.placeholder = '0.00';
  amt.value = line.amt === null ? '' : line.amt;
  amt.addEventListener('input', e => {
    line.amt = e.target.value === '' ? null : parseFloat(e.target.value);
    computeDC();
  });
  amt.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      e.preventDefault();
      const arr = type === 'debit' ? debitLines : creditLines;
      arr.push({amt:null, note:''});
      renderDC();
      focusLastDC(type);
    }
  });

  const rm = document.createElement('button');
  rm.className = 'remove-line';
  rm.textContent = '×';
  rm.addEventListener('click', () => {
    const arr = type === 'debit' ? debitLines : creditLines;
    if (arr.length > 1) arr.splice(index, 1);
    else { arr[0] = {amt:null, note:''}; }
    renderDC();
  });

  row.appendChild(note);
  row.appendChild(amt);
  row.appendChild(rm);
  return row;
}

document.querySelectorAll('.add-line[data-dc]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.dc === 'debit') debitLines.push({amt:null, note:''});
    else creditLines.push({amt:null, note:''});
    renderDC();
  });
});

function focusLastDC(type){
  const container = el(type === 'debit' ? 'debitRows' : 'creditRows');
  const rows = container.querySelectorAll('.dc-row input[type=number]');
  if (rows.length) rows[rows.length - 1].focus();
}

function computeDC(){
  const dTotal = debitLines.reduce((s,l) => s + (l.amt || 0), 0);
  const cTotal = creditLines.reduce((s,l) => s + (l.amt || 0), 0);
  el('dcDebitTotal').textContent = fmt(dTotal);
  el('dcCreditTotal').textContent = fmt(cTotal);
  const net = dTotal - cTotal;
  const netEl = el('dcNet');
  netEl.textContent = (net >= 0 ? '' : '−') + fmt(Math.abs(net));
  netEl.style.color = net < 0 ? 'var(--red)' : 'var(--ink)';
}

renderDC();

/* ==================================================
   PAGE 2 — INVOICE CHECK
================================================== */
const DEFAULT_RATES = [0.01, 0.03, 0.05, 0.08, 0.10, 0.14, 0.22];
let rates = [...DEFAULT_RATES];
let items = [{qty:null, price:null}];
let totalManuallyEdited = false;

async function loadRates(){
  try{
    const r = await window.storage.get('tax-rates', false);
    if (r && r.value){ rates = JSON.parse(r.value); }
  }catch(e){}
  populateRateSelects();
}
async function saveRates(){
  try{ await window.storage.set('tax-rates', JSON.stringify(rates), false); }catch(e){}
}
function populateRateSelects(){
  [el('taxARate'), el('taxBRate')].forEach((sel, idx) => {
    const current = sel.value;
    sel.innerHTML = '';
    rates.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = (r*100).toFixed(0) + '%';
      sel.appendChild(opt);
    });
    if (current && rates.includes(parseFloat(current))){ sel.value = current; }
    else { sel.selectedIndex = idx === 0 ? Math.max(0, rates.indexOf(0.08)) : Math.max(0, rates.indexOf(0.14)); }
  });
}
function addRate(){
  const input = prompt('New tax rate, e.g. 12 for 12%');
  if (input === null) return;
  const val = parseFloat(input) / 100;
  if (isNaN(val) || val < 0) return;
  if (!rates.includes(val)){ rates.push(val); rates.sort((a,b)=>a-b); saveRates(); }
  populateRateSelects();
}
el('addRateA').addEventListener('click', addRate);
el('addRateB').addEventListener('click', addRate);

function renderItems(){
  const container = el('itemRows');
  container.innerHTML = '';
  items.forEach((item, i) => {
    container.appendChild(makeItemRow(item, i));
  });
  recalcTotalSalesFromItems();
}

function makeItemRow(item, i){
  const row = document.createElement('div');
  row.className = 'field-row';
  row.style.marginBottom = '10px';

  const qtyField = document.createElement('div');
  qtyField.className = 'field small';
  if (i === 0){ const l = document.createElement('label'); l.textContent = 'Qty'; qtyField.appendChild(l); }
  const qtyInput = document.createElement('input');
  qtyInput.type = 'number'; qtyInput.placeholder = '—';
  qtyInput.value = item.qty === null ? '' : item.qty;
  qtyInput.addEventListener('input', e => {
    item.qty = e.target.value === '' ? null : parseFloat(e.target.value);
    updateLineTotal(row, item);
    recalcTotalSalesFromItems();
  });
  qtyInput.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); items.push({qty:null, price:null}); renderItems(); focusLastItem(); }
  });
  qtyField.appendChild(qtyInput);

  const mult = document.createElement('div');
  mult.className = 'mult-sign';
  if (i === 0) mult.style.paddingBottom = '9px';
  mult.textContent = '×';

  const priceField = document.createElement('div');
  priceField.className = 'field small';
  if (i === 0){ const l = document.createElement('label'); l.textContent = 'Price'; priceField.appendChild(l); }
  const priceInput = document.createElement('input');
  priceInput.type = 'number'; priceInput.step = '0.01'; priceInput.placeholder = '—';
  priceInput.value = item.price === null ? '' : item.price;
  priceInput.addEventListener('input', e => {
    limitDecimals(e, 2);
    item.price = e.target.value === '' ? null : parseFloat(e.target.value);
    updateLineTotal(row, item);
    recalcTotalSalesFromItems();
  });
  priceInput.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); items.push({qty:null, price:null}); renderItems(); focusLastItem(); }
  });
  priceField.appendChild(priceInput);

  const lineTotal = document.createElement('div');
  lineTotal.className = 'line-total';
  const lt = (item.qty && item.price) ? item.qty * item.price : 0;
  lineTotal.textContent = fmt(lt);

  const rm = document.createElement('button');
  rm.className = 'remove-line';
  rm.textContent = '×';
  rm.addEventListener('click', () => {
    if (items.length > 1) items.splice(i, 1);
    else items[0] = {qty:null, price:null};
    renderItems();
  });

  row.appendChild(qtyField);
  row.appendChild(mult);
  row.appendChild(priceField);
  row.appendChild(lineTotal);
  row.appendChild(rm);
  return row;
}
el('addItem').addEventListener('click', () => { items.push({qty:null, price:null}); renderItems(); });

function focusLastItem(){
  const container = el('itemRows');
  const rows = container.querySelectorAll('.field.small input[type=number]');
  if (rows.length) rows[rows.length - 2].focus(); // last row's Qty input
}

function updateLineTotal(row, item){
  const lt = (item.qty && item.price) ? item.qty * item.price : 0;
  row.querySelector('.line-total').textContent = fmt(lt);
}

function recalcTotalSalesFromItems(){
  const sum = items.reduce((s,it) => s + ((it.qty && it.price) ? it.qty*it.price : 0), 0);
  if (sum > 0){
    el('totalSales').value = sum.toFixed(2);
    totalManuallyEdited = false;
  }
  compute();
}
el('totalSales').addEventListener('input', () => { totalManuallyEdited = true; compute(); });

function compute(){
  const total = parseFloat(el('totalSales').value);
  const discount = parseFloat(el('discount').value) || 0;
  const actual = parseFloat(el('actual').value);

  if (isNaN(total)){
    el('netOut').textContent = '0.00'; el('taxOut').textContent = '0.00'; el('computedOut').textContent = '0.00';
    el('taxAAmt').textContent = '0.00'; el('taxBAmt').textContent = '0.00';
    el('stamp').classList.remove('show'); el('diffReadout').innerHTML = '';
    return null;
  }

  const net = total - discount;
  const aOn = el('taxAOn').checked, bOn = el('taxBOn').checked;
  const aRate = parseFloat(el('taxARate').value) || 0, bRate = parseFloat(el('taxBRate').value) || 0;
  const aSign = parseFloat(el('taxASign').dataset.sign) || 1;
  const bSign = parseFloat(el('taxBSign').dataset.sign) || 1;
  const aAmt = aOn ? net * aRate * aSign : 0, bAmt = bOn ? net * bRate * bSign : 0;
  const totalTax = aAmt + bAmt;
  const computed = net + totalTax;

  el('netOut').textContent = fmt(net);
  el('taxAAmt').textContent = fmt(aAmt);
  el('taxBAmt').textContent = fmt(bAmt);
  el('taxOut').textContent = fmt(totalTax);
  el('computedOut').textContent = fmt(computed);

  const stamp = el('stamp'), diffReadout = el('diffReadout');
  if (!isNaN(actual)){
    const diff = actual - computed;
    const isMatch = Math.abs(diff) < 0.01;
    stamp.textContent = isMatch ? 'MATCHED' : 'REVIEW';
    stamp.classList.add('show');
    stamp.classList.toggle('match', isMatch);
    diffReadout.innerHTML = `Actual <span class="num">${fmt(actual)}</span><br>Diff <span class="num" style="color:${isMatch ? 'var(--green)' : 'var(--red)'}">${diff >= 0 ? '+' : ''}${fmt(diff)}</span>`;
  } else {
    stamp.classList.remove('show'); diffReadout.innerHTML = '';
  }
  return {total, discount, net, aOn, bOn, aRate, bRate, aAmt, bAmt, totalTax, computed, actual};
}
['discount','actual'].forEach(id => el(id).addEventListener('input', compute));
['taxAOn','taxBOn','taxARate','taxBRate'].forEach(id => el(id).addEventListener('change', compute));

document.querySelectorAll('.sign-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const next = btn.dataset.sign === '1' ? '-1' : '1';
    btn.dataset.sign = next;
    btn.textContent = next === '1' ? '+' : '−';
    btn.classList.toggle('neg', next === '-1');
    compute();
  });
});

/* ---- History ---- */
async function loadHistory(){
  let list = [];
  try{ const r = await window.storage.get('invoice-checks', false); if (r && r.value) list = JSON.parse(r.value); }catch(e){}
  renderHistory(list);
  return list;
}
async function saveHistory(list){
  try{ await window.storage.set('invoice-checks', JSON.stringify(list), false); }catch(e){}
}
function renderHistory(list){
  const container = el('historyList');
  container.innerHTML = '';
  if (!list.length){ container.innerHTML = '<div class="empty-note">No saved checks yet — save one above.</div>'; return; }
  list.slice().reverse().forEach(item => {
    const row = document.createElement('div');
    row.className = 'stub';
    row.innerHTML = `
      <span class="dot ${item.status === 'MATCH' ? 'match' : (item.status === 'CHECK' ? 'check' : '')}"></span>
      <span class="time">${item.when}</span>
      <span>${fmt(item.computed)}</span>
      <span class="amt">${item.status || '—'}</span>`;
    container.appendChild(row);
  });
}
el('saveBtn').addEventListener('click', async () => {
  const r = compute();
  if (r === null) return;
  const list = await loadHistory();
  const status = !isNaN(r.actual) ? (Math.abs(r.actual - r.computed) < 0.01 ? 'MATCH' : 'CHECK') : 'UNCHECKED';
  list.push({ when: new Date().toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}), total: r.total, computed: r.computed, actual: r.actual, status });
  await saveHistory(list);
  renderHistory(list);
});
el('clearHistory').addEventListener('click', async () => { await saveHistory([]); renderHistory([]); });

document.querySelectorAll('.corner-btn[data-print]').forEach(btn => {
  btn.addEventListener('click', () => window.print());
});

function todayStr(){
  return new Date().toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
}
document.querySelectorAll('.reportDate').forEach(inp => { inp.value = todayStr(); });

function resetDC(){
  debitLines = [{amt:null, note:''}];
  creditLines = [{amt:null, note:''}];
  renderDC();
  const page = document.getElementById('page1');
  page.querySelectorAll('.reportRef').forEach(i => i.value = '');
  page.querySelectorAll('.reportDate').forEach(i => i.value = todayStr());
  page.querySelectorAll('.handNote').forEach(i => i.value = '');
}

function resetInvoice(){
  items = [{qty:null, price:null}];
  el('discount').value = '0';
  el('totalSales').value = '';
  el('actual').value = '';
  el('taxAOn').checked = true;
  el('taxBOn').checked = true;
  [el('taxASign'), el('taxBSign')].forEach(btn => {
    btn.dataset.sign = '1'; btn.textContent = '+'; btn.classList.remove('neg');
  });
  renderItems();
  populateRateSelects();
  const page = document.getElementById('page2');
  page.querySelectorAll('.reportRef').forEach(i => i.value = '');
  page.querySelectorAll('.reportDate').forEach(i => i.value = todayStr());
  page.querySelectorAll('.handNote').forEach(i => i.value = '');
  compute();
}

document.querySelectorAll('.corner-btn[data-reset]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.reset === '1') resetDC();
    else resetInvoice();
  });
});

/* Printed report should say "Report", not the app name — and avoid it appearing twice.
   Also hide the handwritten-note row entirely if nothing was written in it. */
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('h1').forEach(h => { h.dataset.orig = h.textContent; h.textContent = 'Report'; });
  document.title = 'Report';
  document.querySelectorAll('.note-area').forEach(area => {
    const inp = area.querySelector('.handNote');
    area.classList.toggle('note-empty', !inp.value.trim());
  });
});
window.addEventListener('afterprint', () => {
  document.querySelectorAll('h1').forEach(h => { h.textContent = h.dataset.orig || 'Ledger'; });
  document.title = 'Ledger';
  document.querySelectorAll('.note-area').forEach(area => area.classList.remove('note-empty'));
});

(async function init(){
  renderItems();
  await loadRates();
  await loadHistory();
  compute();
})();
</script>
</body>
</html>
